apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: nexus-worker
  description: Cloudflare Worker for the nexus runtime — the sale-event ledger, the determination engine, and determinations
spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: nexus
  path: apps/nexus-worker
  dependsOn:
    - component: membership-worker
    - component: policy-worker
    - component: events-worker
    - component: notifications-worker
    # The §9 plan-limit check on the exposure board. Optional at runtime — an
    # unbound BILLING_WORKER monitors every jurisdiction rather than none — but
    # declared here so the binding target exists before this worker deploys.
    - component: billing-worker
    # §9 usage reporting from the evaluation cron. Optional at runtime — an
    # unbound METERING_WORKER costs a usage row and never a determination — but
    # declared so the binding target exists before this worker deploys.
    - component: metering-worker
    # Shared workspace packages this component BUNDLES. Declared so a change
    # to one marks this component changed and redeploys it — without the
    # edge, `orun plan --changed` keys on `path:` alone and a worker can run
    # a months-old copy of a package that has since changed underneath it.
    - component: contracts
    - component: db
    - component: notifications-client
  # BF6 wiring documents from orun secrets (SEC-JOB): lease-published by
  # the infra components; wire-live renders the wrangler template from
  # these instead of Secrets Manager documents.
  secretEnv:
    WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://nexara/nexara/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
    WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://nexara/nexara/prod/WIRING_CLOUDFLARE_HYPERDRIVE"

  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    # BF6b: deploy-time wiring — wrangler.jsonc is rendered, never committed.
    # Verify lanes render from wiring.fixture.json (offline); deploy lanes
    # resolve real IDs from the Secrets Manager wiring manifest (BF5).
    orgName: sourceplane
    owner: sourceplane
    repo: nexara

    turboFilter: "@saas/nexus-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-hyperdrive"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/nexus-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/nexus-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: nexus
    runtime: cloudflare
