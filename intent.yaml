apiVersion: sourceplane.io/v1
kind: Intent

metadata:
  name: nexara
  description: Economic-nexus threshold monitoring for ecommerce sellers
  namespace: sourceplane

execution:
  state:
    backendUrl: https://api-edge-prod.oruncloud.workers.dev
    # Declared, enforced tenancy: the workspace claim is sent on every remote op
    # (including the credential-free CI OIDC exchange) so orun-cloud can enforce
    # claim ⊆ authorized. Declaring it implies strict mode — a non-interactive
    # run that resolves no workspace fails fast (specs/oidc-ci-tenancy §4.1).
    # `workspace` is the leading spelling in orun v2.20.0 (a ws_ Workspace ID,
    # slug, or legacy org_ id); it supersedes the deprecated `org:` alias.
    workspace: org_688ef44a036e4ae9b15daa64f4a6588f
    project: nexara
    requireOrg: true
    # Push/sync the resolved catalog to orun-cloud after a successful plan on the
    # default branch, keeping the org-global catalog head fresh without an
    # explicit `--push-catalog`.
    autopushCatalog: true

compositions:
  sources:
    # The composition stack lives in sourceplane/stack-tectonic and is consumed
    # as a published OCI artifact rather than a repo-local directory. Pin an
    # explicit version: a bare repository reference resolves to `:latest`, which
    # would let a catalog release change this repo's execution contracts without
    # a commit here. Bumping the tag is the deliberate upgrade step.
    - name: stack-tectonic
      kind: oci
      ref: oci://ghcr.io/sourceplane/stack-tectonic:0.18.2
  resolution:
    precedence:
      - stack-tectonic
    bindings:
      terraform: stack-tectonic
      cloudflare-domain: stack-tectonic
      db-migrate: stack-tectonic

discovery:
  roots:
    - apps/
    - infra/
    - packages/
    - tests/

automation:
  triggerBindings:
    github-pull-request:
      description: Pull request validation
      on:
        provider: github
        event: pull_request
        actions:
          - opened
          - synchronize
          - reopened
          - ready_for_review
        baseBranches:
          - main
      plan:
        scope: changed
        base: pull_request.base.sha
        head: pull_request.head.sha

    github-push-main:
      description: Main branch stack convergence after merge
      on:
        provider: github
        event: push
        branches:
          - main

    local-development:
      description: Local testing with full Terraform execution
      on:
        provider: local

environments:
  dev:
    activation:
      triggerRefs:
        - github-pull-request
        - github-push-main
        - local-development
    parameterDefaults:
      terraform:
        lane: verify
        namespace: sourceplane
        namespacePrefix: dev-
        owner: sourceplane
        repo: nexara
        CONSOLE_CUSTOM_DOMAIN: ""
    policies:
      requireApproval: "false"
    env:
      BASE_DOMAIN: nexara.dev

  stage:
    activation:
      triggerRefs:
        - github-pull-request
        - github-push-main
    parameterDefaults:
      terraform:
        lane: verify
        namespace: sourceplane
        namespacePrefix: stg-
        owner: sourceplane
        repo: nexara
        CONSOLE_CUSTOM_DOMAIN: stage.nexara.dev
    policies:
      requireApproval: "false"
    env:
      BASE_DOMAIN: nexara.dev

  prod:
    activation:
      triggerRefs:
        - github-pull-request
        - github-push-main
    promotion:
      dependsOn:
        - environment: stage
    parameterDefaults:
      terraform:
        lane: verify
        namespace: sourceplane
        namespacePrefix: prod-
        owner: sourceplane
        repo: nexara
        CONSOLE_CUSTOM_DOMAIN: prod.nexara.dev
    policies:
      requireApproval: "false"
    env:
      BASE_DOMAIN: nexara.dev

# Repo-level catalog entity: front page + role-tagged docs (rendered in
# the workspace Docs library, pinned to the commit by `orun plan`).
#
# NX0: the front page is `docs/overview.md`, not `README.md`. The catalog
# front page is what a customer or a prospect is shown; README.md is what a
# contributor reads to build the thing. They are different documents with
# different readers, and conflating them is why the workspace described a
# starter for as long as it did.
repo:
  displayName: Nexara
  description: >-
    Economic-nexus threshold monitoring for ecommerce sellers — an append-only
    sale-event ledger, per-jurisdiction measurement against versioned rule data,
    and immutable determinations that can be reproduced years later.
  tags:
    - sales-tax
    - compliance
    - economic-nexus
    - ecommerce
    - multi-tenant
    - cloudflare-workers
    - supabase
  links:
    - { title: Product overview, url: docs/overview.md }
    - { title: nexus epic, url: specs/epics/nexus/README.md }
    - { title: Technical design, url: specs/epics/nexus/design.md }
  docs:
    overview: docs/overview.md
    pages:
      - { path: specs/epics/nexus/design.md, role: architecture, title: nexus — technical design }
      - { path: ai/context/operations.md, role: runbook, title: Operating contract }
      - { path: ai/context/deployment.md, role: reference, title: Live deployment manifest }
