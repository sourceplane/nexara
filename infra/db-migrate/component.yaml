apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: db-migrate
  description: Applies database migrations to stage and prod Supabase instances
  labels:
    domain: infra
    scope: database
    team: platform
    layer: data

spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: db-migrate
  lifecycle: production
  owner: platform
  domain: infra

  dependsOn:
    - component: db
    # Migrations read the Supabase connection from the orun secrets the
    # `supabase` component lease-publishes post-apply.
    - component: supabase

  path: packages/db/src/migrations

  parameters:
    nodeVersion: "20"
    pnpmVersion: "10.12.1"
    owner: sourceplane
    repo: nexara

  # The runner's DB identity (de-AWS — replaces the Secrets Manager read).
  # These are stored secrets and are read in both modes.
  secretEnv:
    SUPABASE_PROJECT_REF: "secret://nexara/nexara/{{ .environment }}/SUPABASE_PROJECT_REF"
    SUPABASE_DB_PASSWORD: "secret://nexara/nexara/{{ .environment }}/SUPABASE_DB_PASSWORD"
    SUPABASE_DB_URL: "secret://nexara/nexara/{{ .environment }}/SUPABASE_DB_URL"

  # The Management-API token is OPTIONAL here because it is only used in apply
  # mode, and `secretEnv` is resolved for every profile including `plan`.
  #
  # `packages/db/src/runner/cli.ts` is unambiguous about this:
  #
  #     if (mode === "plan") return null;        // never reads the token
  #     if (!SUPABASE_ACCESS_TOKEN) throw new Error("… required for apply mode");
  #
  # Requiring it in `secretEnv` therefore made every PR mint a fresh
  # Management-API token from the Supabase integration that the plan then threw
  # away — and when that integration's broker hits `limit_reached`, plan fails
  # at secret resolution having never opened a migration file. That is what
  # blocked this lane.
  #
  # Apply-mode safety is unchanged. The token is still resolved whenever it is
  # available, and when it is not, the runner's own guard above throws before
  # the adapter is constructed and therefore before any migration touches the
  # database. That error names the missing variable, which is strictly more
  # useful than a generic secret-resolution failure.
  #
  # Least privilege agrees with the outage: a read-only plan should not be
  # holding a Management-API token at all.
  optionalSecretEnv:
    SUPABASE_ACCESS_TOKEN: "secret://nexara/nexara/{{ .environment }}/SUPABASE_ACCESS_TOKEN"

  subscribe:
    environments:
      - name: stage
        profile: plan
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        profile: plan
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
# ci: re-trigger deploy (batch A — runner-starvation recovery 20260622T115650Z)
# ci: re-trigger deploy (batch A — runner-starvation recovery 20260622T115650Z)
